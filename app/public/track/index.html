<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Firefly · Live walk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --walk: #2f6fd6; --walk-bg: #e8f0fc; --alert: #c62828; --alert-bg: #fdecea;
    --safe: #1e7d3a; --safe-bg: #e6f4ea; --ended: #555; --ended-bg: #eceae6; --stale: #9a6200; --stale-bg: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1f1f22; --text: #f2f2f4; --muted: #a0a0a8; --line: #2e2e33;
      --walk-bg: #1a2740; --alert-bg: #3a1514; --safe-bg: #14301d; --ended-bg: #2a2a2d; --stale-bg: #3a2c0c;
      --walk: #7aa7f0; --safe: #6fcf8b; --stale: #f0b44a; --ended: #bbb;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header { padding: 14px 16px 10px; }
  header h1 { margin: 0; font-size: 20px; }
  header .brand { font-size: 13px; color: var(--muted); }
  #banner {
    margin: 0 16px; padding: 12px 14px; border-radius: 12px; font-weight: 600;
    background: var(--walk-bg); color: var(--walk); display: flex; align-items: center; gap: 10px;
  }
  #banner .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  body.walking #banner .dot { animation: pulse 1.6s infinite; }
  body.alert #banner { background: var(--alert); color: #fff; font-size: 18px; }
  body.home_safe #banner { background: var(--safe-bg); color: var(--safe); }
  body.ended #banner { background: var(--ended-bg); color: var(--ended); }
  #stale { display: none; margin: 8px 16px 0; padding: 10px 14px; border-radius: 10px;
           background: var(--stale-bg); color: var(--stale); font-weight: 600; }
  body.is-stale #stale { display: block; }
  @keyframes pulse { 50% { opacity: .3; } }

  #alertPanel { display: none; margin: 10px 16px 0; gap: 10px; flex-direction: column; }
  body.alert #alertPanel { display: flex; }
  .row { display: flex; gap: 10px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; text-decoration: none;
    cursor: pointer;
  }
  .btn-911 { background: var(--alert); color: #fff; font-size: 22px; min-height: 72px; }
  .btn-clip { background: var(--card); color: var(--text); border: 2px solid var(--line); }
  .btn-clip:disabled { opacity: .5; cursor: default; }
  .sim { font-size: 14px; padding: 10px 12px; border: 2px dashed var(--alert); border-radius: 10px;
         background: var(--alert-bg); }
  .sim strong { color: var(--alert); }

  #map { flex: 1; min-height: 320px; margin: 10px 16px 0; border-radius: 12px; overflow: hidden;
         border: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 16px 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #expired { display: none; flex: 1; align-items: center; justify-content: center; text-align: center; padding: 32px 16px; }
  #expired h2 { margin: 0 0 6px; }
  body.is-expired #expired { display: flex; }
  body.is-expired main { display: none; }
  main { display: flex; flex-direction: column; flex: 1; }
  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--walk); border: 3px solid #fff;
        box-shadow: 0 0 0 2px var(--walk), 0 2px 6px rgba(0,0,0,.3); }
  body.alert .me { background: var(--alert); box-shadow: 0 0 0 2px var(--alert), 0 0 0 10px rgba(198,40,40,.25); }
</style>
</head>
<body class="walking">
<main>
  <header>
    <div class="brand">Firefly live walk</div>
    <h1 id="title">Loading…</h1>
  </header>
  <div id="banner" role="status" aria-live="assertive"><span class="dot"></span><span id="bannerText">Connecting…</span></div>
  <div id="stale" role="status" aria-live="polite"></div>

  <section id="alertPanel" aria-label="Alert actions">
    <div class="row">
      <a class="btn btn-911" href="tel:911">Call 911</a>
    </div>
    <div class="row">
      <button id="clipBtn" class="btn btn-clip" type="button" disabled>▶ Play audio clip</button>
    </div>
    <div class="sim"><strong>Simulation:</strong> in the full product, a monitoring service would contact dispatch now.</div>
  </section>

  <div id="map" aria-label="Map of her walk"></div>

  <div class="stats">
    <div class="stat"><div class="k">ETA</div><div class="v" id="eta">–</div></div>
    <div class="stat"><div class="k">Left</div><div class="v" id="left">–</div></div>
    <div class="stat"><div class="k">Last update</div><div class="v" id="updated">–</div></div>
  </div>
</main>

<section id="expired">
  <div>
    <h2>Link expired</h2>
    <p>This tracking link is no longer active.</p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  'use strict';
  const STALE_MS = 60_000;
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '')
             || new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);

  const state = { walkId: null, name: 'Your friend', status: 'walking', lastTs: null, clipUrl: null, ws: null, finished: false };
  let map, routeLine, trailLine, me, home, followed = false;

  // ---------- rendering ----------
  const STATUS_TEXT = {
    walking: (n) => `${n} is walking home`,
    alert: (n) => `ALERT: ${n} may need help`,
    home_safe: (n) => `${n} is home safe`,
    ended: () => 'Walk ended',
  };

  function setStatus(status) {
    state.status = status;
    state.finished = status === 'home_safe' || status === 'ended';
    document.body.classList.remove('walking', 'alert', 'home_safe', 'ended');
    document.body.classList.add(status);
    $('bannerText').textContent = (STATUS_TEXT[status] || STATUS_TEXT.walking)(state.name);
    if (status === 'alert' && navigator.vibrate) navigator.vibrate([300, 150, 300]);
    if (state.finished) $('eta').textContent = status === 'home_safe' ? 'Arrived' : '–';
    renderStale();
  }

  function setClip(url) {
    if (!url) return;
    state.clipUrl = url;
    $('clipBtn').disabled = false;
  }

  const fmtMin = (s) => s == null ? '–' : s < 60 ? '<1 min' : `${Math.round(s / 60)} min`;
  const fmtDist = (m) => m == null ? '–' : m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`;

  function ago(ms, short = false) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return `${s}s ago`;
    const m = Math.floor(s / 60);
    if (short) return m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ago`;
    return `${m} minute${m === 1 ? '' : 's'} ago`;
  }

  function renderStale() {
    if (!state.lastTs) { $('updated').textContent = '–'; return; }
    const age = Date.now() - new Date(state.lastTs).getTime();
    $('updated').textContent = ago(age, true);
    const stale = age > STALE_MS && !state.finished;
    document.body.classList.toggle('is-stale', stale);
    if (stale) $('stale').textContent = `Last seen ${ago(age)} at the marker on the map`;
  }

  function applyPosition(p) {
    if (state.lastTs && new Date(p.ts) <= new Date(state.lastTs)) { renderStale(); return; } // old or repeated (polling)
    state.lastTs = p.ts;
    const ll = [p.lat, p.lng];
    if (!me) {
      me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [24, 24] }) }).addTo(map);
    } else {
      me.setLatLng(ll);
    }
    trailLine.addLatLng(ll);
    if (!followed) { map.setView(ll, Math.max(map.getZoom(), 16)); followed = true; }
    else if (!map.getBounds().pad(-0.15).contains(ll)) map.panTo(ll);
    if (!state.finished) {
      if (p.eta_s != null) $('eta').textContent = fmtMin(p.eta_s);
      if (p.remaining_m != null) $('left').textContent = fmtDist(p.remaining_m);
    }
    renderStale();
  }

  // ---------- map ----------
  function initMap(walk) {
    map = L.map('map', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap contributors',
    }).addTo(map);

    routeLine = L.polyline(walk.route.points, { color: '#2f6fd6', weight: 6, opacity: 0.35 }).addTo(map);
    trailLine = L.polyline(walk.trail || [], { color: '#2f6fd6', weight: 4 }).addTo(map);
    home = L.circleMarker([walk.destination.lat, walk.destination.lng], { radius: 8, color: '#1e7d3a', fillOpacity: 0.9 })
      .addTo(map).bindTooltip(walk.destination.label || 'Home');
    map.fitBounds(routeLine.getBounds(), { padding: [24, 24] });
    // The map's box changes size when the alert panel appears or the phone rotates.
    new ResizeObserver(() => map.invalidateSize()).observe($('map'));
  }

  // ---------- data ----------
  async function fetchSnapshot() {
    const res = await fetch(`/api/track/${encodeURIComponent(token)}`, { cache: 'no-store' });
    if (res.status === 404 || res.status === 410) { showExpired(); return null; }
    if (!res.ok) throw new Error(`track ${res.status}`);
    return res.json();
  }

  function applySnapshot(w) {
    state.walkId = w.walk_id;
    state.name = w.name || state.name;
    $('title').textContent = state.name;
    document.title = `${state.name} · Firefly`;
    if (!map) initMap(w);
    if (w.last) applyPosition(w.last);
    else { $('eta').textContent = fmtMin(w.route.eta_s); $('left').textContent = fmtDist(w.route.distance_m); }
    setClip(w.clip_url);
    if (w.status !== state.status) setStatus(w.status);
  }

  function showExpired() {
    document.body.classList.add('is-expired');
    if (state.ws) state.ws.close();
    state.finished = true;
    clearInterval(pollTimer);
  }

  function onMessage(msg) {
    if (msg.type === 'position') applyPosition(msg);
    else if (msg.type === 'status') { setStatus(msg.status); setClip(msg.clip_url); }
    else if (msg.type === 'clip') setClip(msg.clip_url);
  }

  // ---------- live connection (API Gateway WebSocket), with reconnect ----------
  // AWS closes idle sockets after 10 minutes, so the page pings every 5.
  let backoff = 1000;
  let pingTimer;
  async function connect() {
    if (document.body.classList.contains('is-expired')) return;
    try {
      const res = await fetch(`/api/negotiate?token=${encodeURIComponent(token)}`, { cache: 'no-store' });
      if (res.status === 404 || res.status === 410) return showExpired();
      if (res.status === 503) return; // live updates not configured (local dev): polling only
      if (!res.ok) throw new Error(`negotiate ${res.status}`);
      const { url } = await res.json();
      const ws = new WebSocket(url);
      state.ws = ws;
      ws.onopen = () => {
        backoff = 1000;
        clearInterval(pingTimer);
        pingTimer = setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('{"action":"ping"}'); }, 5 * 60_000);
        fetchSnapshot().then((w) => w && applySnapshot(w)).catch(() => {});
      };
      ws.onmessage = (e) => {
        try { onMessage(JSON.parse(e.data)); } catch { /* ignore non-JSON frames */ }
      };
      ws.onclose = () => { clearInterval(pingTimer); state.ws = null; retry(); };
    } catch {
      retry();
    }
  }
  function retry() {
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30_000);
  }

  // Polling: every 3 s when there's no live socket (keeps updates within the 5 s target),
  // once a minute as a safety net when there is one.
  let pollTimer;
  let polling = false;
  function startPolling() {
    let tick = 0;
    pollTimer = setInterval(() => {
      tick++;
      const live = state.ws && state.ws.readyState === WebSocket.OPEN;
      if (polling || (live && tick % 20 !== 0)) return;
      polling = true;
      fetchSnapshot().then((w) => w && applySnapshot(w)).catch(() => {}).finally(() => { polling = false; });
    }, 3000);
  }

  $('clipBtn').addEventListener('click', () => {
    if (!state.clipUrl) return;
    const audio = new Audio(state.clipUrl);
    $('clipBtn').textContent = '♪ Playing…';
    audio.onended = audio.onerror = () => { $('clipBtn').textContent = '▶ Play audio clip'; };
    audio.play().catch(() => { $('clipBtn').textContent = 'Clip unavailable'; });
  });

  setInterval(renderStale, 5000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fetchSnapshot().then((w) => w && applySnapshot(w)).catch(() => {});
  });

  (async () => {
    if (token.length < 16) return showExpired();
    try {
      const w = await fetchSnapshot();
      if (!w) return;
      applySnapshot(w);
      setStatus(w.status);
      connect();
      startPolling();
    } catch {
      $('bannerText').textContent = 'Can’t reach Firefly. Retrying…';
      setTimeout(() => location.reload(), 10_000);
    }
  })();
})();
</script>
</body>
</html>
